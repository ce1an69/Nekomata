[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nekomata-tarot"
version = "0.1.3"
description = "Pixel-art cat tarot divination app in your terminal"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Celan", email = "luojunxiong@qq.com"},
]
keywords = ["tarot", "terminal", "tui", "cat", "pixel-art", "divination", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

dependencies = [
    "textual>=0.50",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "textual-image>=0.12",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1",
    "pyinstaller>=6.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/ce1an69/Nekomata"
Repository = "https://github.com/ce1an69/Nekomata"
Issues = "https://github.com/ce1an69/Nekomata/issues"
Documentation = "https://github.com/ce1an69/Nekomata/tree/main/docs"
Changelog = "https://github.com/ce1an69/Nekomata/blob/main/docs/en/CHANGELOG.md"

[project.scripts]
nekomata-tarot = "nekomata.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["nekomata"]

[tool.coverage.report]
fail_under = 77

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nekomata = [
    "data/**/*",
    "assets/cards/*/*.png",
    "assets/fonts/*.woff2",
    "assets/icon/*.icns",
    "assets/icon/*.ico",
    "assets/ui/**/*",
    "web/static/**/*",
]

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["nekomata"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src"]
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"

[dependency-groups]
dev = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
]
