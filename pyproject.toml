[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nekomata-tarot"
version = "0.1.0"
description = "像素风猫咪塔罗牌终端占卜应用"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "textual>=0.50",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "textual-image>=0.12",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1",
    "pyinstaller>=6.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pyright>=1.1",
]

[project.urls]
Homepage = "https://github.com/ce1an69/Nekomata"
Repository = "https://github.com/ce1an69/Nekomata"
Issues = "https://github.com/ce1an69/Nekomata/issues"

[project.scripts]
nekomata-tarot = "nekomata.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nekomata = [
    "data/**/*",
    "assets/cards/*/*.png",
    "assets/fonts/*.ttf",
    "assets/fonts/*.woff2",
    "assets/icon/*.icns",
    "assets/icon/*.ico",
    "assets/ui/**/*",
    "web/static/**/*",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src"]
reportMissingImports = "none"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
